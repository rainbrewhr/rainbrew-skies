<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#7b4bb8">
<title>Rainbrew Sky | Staff</title>
<!-- Staff-only page. Open it once with the staff link (or paste the staff code) and this device stays connected. -->
<style>
:root{--ink:#3d2566;--bg:#f6f1ff;--card:#fff;--line:#e2d6fb;--btn:#7b4bb8;--btn2:#ff8fcf;--ok:#1f8a57;--warn:#b45309;--bad:#b42318;--soft:#efe6ff}
@media (prefers-color-scheme:dark){:root{--ink:#f3e8ff;--bg:#1d1433;--card:#2a1d49;--line:#46336f;--btn:#a78bfa;--btn2:#e56bb8;--ok:#6ee7a8;--warn:#fdba74;--bad:#fca5a5;--soft:#35255c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.35;overscroll-behavior-y:contain}
#appView{max-width:760px;margin:0 auto;padding:0 12px calc(92px + env(safe-area-inset-bottom,0px))}
.hdr{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;margin:0 -12px;background:var(--bg);border-bottom:1px solid var(--line)}
.ht{flex:1;min-width:0}.ht b{display:block;font-size:1.15rem}.meta{font-size:.84rem;opacity:.82}.hdr .meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h1{font-size:1.4rem;margin:0}h2{font-size:1.02rem;margin:0 0 6px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:700;border:1px solid var(--line);white-space:nowrap}
.ok{color:var(--ok);border-color:var(--ok)}.warnc{color:var(--warn);border-color:var(--warn)}.badc{color:var(--bad);border-color:var(--bad)}.gift{color:var(--btn);border-color:var(--btn)}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:12px -12px 8px;padding:0 12px;scrollbar-width:none;scroll-snap-type:x proximity}.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;scroll-snap-align:start;padding:11px 16px;border-radius:14px;border:2px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:700;cursor:pointer;min-height:48px}
.tab.on{background:linear-gradient(90deg,var(--btn2),var(--btn));color:#fff;border-color:transparent}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:48px}
label{display:block;font-size:.86rem;font-weight:700;margin:12px 0 4px}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 16px;min-height:50px;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--btn2),var(--btn));text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;touch-action:manipulation}
button.alt,.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}button.red{background:var(--bad);color:#fff}button:disabled,.btn.dis{opacity:.5;pointer-events:none}
button.icon{min-width:50px;padding:0;font-size:1.3rem}
button:focus-visible,input:focus-visible,select:focus-visible,.btn:focus-visible{outline:3px solid var(--btn);outline-offset:2px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}.card.prize{border-color:var(--btn2);box-shadow:0 0 0 3px var(--soft)}
.head{display:flex;align-items:center;gap:10px}.rank{font-size:1.5rem;min-width:2.2rem;text-align:center}.who{flex:1;min-width:0}.who b{display:block;font-size:1.1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{font-size:1.4rem;font-weight:800}.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;letter-spacing:.05em;word-break:break-all}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.acts>*{flex:1 1 150px}
.row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;min-height:56px}.row .who b{font-size:1rem}
.banner{margin:10px 0;border-radius:14px;padding:12px 14px;font-weight:600}.banner.bad{background:var(--bad);color:#fff}.banner.warn{background:#fde68a;color:#78350f}.banner.info{background:var(--soft)}
.banner button{margin-top:8px;background:#fff;color:#222;min-height:44px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;max-width:520px;margin:0 auto;background:var(--ok);color:#fff;border-radius:14px;padding:12px 16px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);text-align:center}#toast.bad{background:var(--bad)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bottom button{flex:1;border-radius:0;background:transparent;color:var(--ink);flex-direction:column;gap:2px;min-height:62px;font-size:.78rem;opacity:.75}.bottom button b{font-size:1.35rem;line-height:1}.bottom button.on{opacity:1;color:var(--btn);box-shadow:inset 0 3px 0 var(--btn)}
.modal{position:fixed;inset:0;z-index:80;background:rgba(20,10,40,.6);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}.modal[hidden]{display:none}
.dlg{background:var(--card);color:var(--ink);border-radius:20px;padding:18px;width:100%;max-width:480px;max-height:86vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.4)}.dlg h2{font-size:1.15rem}.dlg p{margin:8px 0}
.center{text-align:center}[hidden]{display:none!important}#fatal{position:fixed;left:0;right:0;top:0;z-index:99;background:#b42318;color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;font-weight:700;font-size:.9rem}#boot{padding:40px 18px;text-align:center}.pad{padding:28px 6px}.status{padding:8px 0;border-bottom:1px solid var(--line)}.status:last-child{border:0}
.lbl{display:flex;justify-content:space-between;gap:8px;align-items:center}
</style></head><body>
<div id="fatal" hidden></div>
<div id="boot"><b>Loading the staff page…</b><p class="meta">If this message stays, your browser could not run the page. Open it in Chrome or Safari from your website address (for example https://yourname.github.io/yourgame/verify.html), not from a downloaded file.</p></div>
<script>window.addEventListener('error',function(e){var f=document.getElementById('fatal');if(f){f.hidden=false;f.textContent='This page hit a problem: '+(e.message||'unknown error')+(e.lineno?' (line '+e.lineno+')':'')+'. Take a screenshot and send it to the game owner.';}});window.addEventListener('unhandledrejection',function(e){var f=document.getElementById('fatal');if(f){f.hidden=false;f.textContent='This page hit a problem: '+String(e.reason&&e.reason.message||e.reason||'unknown')+'. Take a screenshot and send it to the game owner.';}});</script>
<main id="app">
<div id="connectView" hidden></div>
<div id="appView" hidden>
  <header class="hdr"><div class="ht"><b>Magic Catch staff</b><span class="meta" id="hsub"></span></div><button class="icon alt" id="refreshBtn" data-act="refresh" aria-label="Refresh">⟳</button></header>
  <div id="banner"></div>
  <section id="v-winners">
    <div class="tabs" id="tabs" role="tablist"></div>
    <input id="q" type="search" placeholder="Search a code, name or phone number" autocomplete="off" autocapitalize="off" inputmode="search" enterkeyhint="search">
    <div id="found"></div><div id="list"></div>
  </section>
  <section id="v-comp" hidden><div id="boards"></div><div id="compcard"></div></section>
  <section id="v-tools" hidden><div id="diag"></div><div id="tools"></div></section>
  <nav class="bottom" id="nav" aria-label="Sections">
    <button data-act="view" data-code="winners" id="n-winners"><b>🏆</b>Winners</button>
    <button data-act="view" data-code="comp" id="n-comp"><b>🏁</b>Contest</button>
    <button data-act="view" data-code="tools" id="n-tools"><b>🛠</b>Tools</button>
  </nav>
</div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"><div class="dlg" id="dlg"></div></div>
<div id="toast" hidden role="status"></div>
</main>
<script>
'use strict';
const STAFF_BUILD = '3.1';
const SERVER_URL = 'https://script.google.com/macros/s/AKfycbxslDtAN2GsYII01RoemTYzvucsgK6wDBKodVhmfXh1BP5uYggbnUfKSMiJvzsOjS_z/exec';                         // the game's own server address: the staff page always talks to the same server as the game                                // must match the game and Code.gs: a different number is shown as a warning
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const MODES = [['rank', 'Ranked'], ['classic', 'Classic']], MODE_NAME = { rank: 'Ranked', classic: 'Classic', rush: 'Rush', infinite: 'Infinite' };
const ERRS = { auth: 'That PIN is wrong, or it was changed. Ask the game owner.', locked: 'Too many wrong attempts. Wait 10 minutes.', notfound: 'No score found with that code.', busy: 'The server is busy. Try again in a moment.' };
const HELP = 'Can’t reach the server. Ask the game owner to check in Apps Script: Deploy → Manage deployments → Edit → “Who has access” must be Anyone, the address must end in /exec, then Version: New version → Deploy.';
const relCmp = (a, b) => { const x = String(a || '0').split('.').map(Number), y = String(b || '0').split('.').map(Number); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0) ? 1 : -1; } return 0; };   // 7.10 is newer than 7.9
const app = $('app');
let conn = LS.get('wg_staff', null);
if (conn && conn.k && conn.u !== SERVER_URL) { conn = { u: SERVER_URL, k: conn.k }; LS.set('wg_staff', conn); }   // an older staff code may hold an old address: repaired
const S = { view: 'winners', mode: 'rank', rows: [], players: 0, info: null, season: '', auto: true, q: '', found: null, open: {}, prizes: +LS.get('wg_staff_prizes', 3) || 3, who: LS.get('wg_staff_who', ''), busy: false, updated: 0, loaded: false, error: '', netErr: false, comp: null, status: null, diag: null, form: null, modal: null, toast: '', bad: false };

/* ---------- connect (one time) ---------- */
function decode(str) {                                    // accepts the staff link, the staff code, or just the staff key
  str = String(str || '').trim();
  const m = /[#?&]s=([\w\-=]+)/.exec(str); if (m) str = m[1];
  try {
    let b = str.replace(/-/g, '+').replace(/_/g, '/'); while (b.length % 4) b += '=';
    const j = JSON.parse(atob(b));
    if (j && j.k) return { u: SERVER_URL || String(j.u || ''), k: String(j.k) };
  } catch (e) {}
  if (/^\S{6,64}$/.test(str) && SERVER_URL) return { u: SERVER_URL, k: str };                       // a PIN you chose
  return null;
}
function connect(str) {
  const c = decode(str);
  if (!c) { S.error = 'Type your staff PIN (6 or more characters, no spaces).'; render(); return false; }
  conn = c; LS.set('wg_staff', c); S.error = ''; load(); return true;
}
function disconnect() { conn = null; LS.set('wg_staff', null); S.rows = []; S.loaded = false; S.status = null; render(); }

/* ---------- server ---------- */
async function call(body) {
  let r; try { r = await fetch(conn.u, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ key: conn.k }, body)) }); } catch (e) { const x = new Error(HELP); x.code = 'net'; throw x; }
  let j; try { j = await r.json(); } catch (e) { const x = new Error('The server answered with a web page instead of data. In Apps Script set “Who has access” to Anyone and redeploy a New version.'); x.code = 'html'; throw x; }
  if (!j.ok) { const e = new Error(ERRS[j.err] || ('Error: ' + j.err)); e.code = j.err; throw e; }
  return j;
}
function flash(msg, bad) { S.toast = msg; S.bad = !!bad; renderToast(); clearTimeout(flash.t); flash.t = setTimeout(() => { S.toast = ''; renderToast(); }, 3800); }
async function load(silent) {
  if (!conn || S.busy) return; S.busy = true; if (!silent) renderHeader();
  try {
    try { const st = await call({ action: 'a_status' }); S.status = st; S.comp = st.comp; } catch (e) { if (e.code === 'auth' || e.code === 'net') throw e; }
    if (S.mode === 'contest' && !S.comp) S.mode = 'rank';
    const j = await call(S.mode === 'contest' ? { action: 'a_top', mode: 'rank', season: S.comp.season, limit: 100 } : { action: 'a_top', mode: S.mode, limit: 100 });
    S.rows = j.rows; S.players = j.players; S.season = j.season; S.info = j.info || null; S.auto = j.auto; S.updated = Date.now(); S.loaded = true; S.error = ''; S.netErr = false;
  } catch (e) { S.error = e.message; S.netErr = e.code === 'net' || e.code === 'html'; if (e.code === 'auth') { conn = null; LS.set('wg_staff', null); } }
  S.busy = false; render();
}

/* ---------- dialogs inside the page (phones and in-app browsers often block pop-ups) ---------- */
let modalResolve = null;
function ask(o) {                                           // {title, body, ok, cancel, danger, input:{label,value,placeholder}} -> Promise<{ok, value}>
  return new Promise(res => { modalResolve = res; S.modal = o; renderModal(); try { history.pushState({ rbm: 1 }, ''); } catch (e) {} });
}
function closeModal(result) { const r = modalResolve; modalResolve = null; S.modal = null; renderModal(); if (r) r(result || { ok: false }); }

/* ---------- actions ---------- */
const norm = c => String(c || '').toUpperCase().replace(/\s/g, '');
function patchRow(row) { const i = S.rows.findIndex(r => r.code === row.code); if (i >= 0) S.rows[i] = row; if (S.found && S.found.code === row.code) S.found = row; }
function msgFor(r, rank) { return 'Hi ' + r.name + '! 🎉 Congrats from Rainbrew Coffee Shop. You’re ' + (rank ? '#' + rank + ' ' : '') + 'in Magic Catch (' + r.mode + ') with ' + r.score + ' pts. Please show your code ' + r.code + ' at the counter to claim your prize.'; }
function setView(v) { S.view = v; renderView(); window.scrollTo && window.scrollTo(0, 0); if (v === 'comp') renderComp(); if (v === 'tools') renderTools(); }
async function act(a, code, extra) {
  try {
    if (a === 'view') { try { history.pushState({ rbv: 1 }, ''); } catch (e) {} return setView(code); }
    if (a === 'mok') { const el = $('mi'); return closeModal({ ok: true, value: el ? el.value : '' }); }
    if (a === 'mcancel') return closeModal({ ok: false });
    if (a === 'mode') { S.mode = code; S.found = null; S.q = ''; if ($('q')) $('q').value = ''; S.rows = []; S.loaded = false; S.busy = false; return load(); }
    if (a === 'refresh') { S.busy = false; return load(); }
    if (a === 'toggle') { S.open[code] = !S.open[code]; return renderList(); }
    if (a === 'prizes') { S.prizes = Math.max(1, Math.min(20, S.prizes + (+code))); LS.set('wg_staff_prizes', S.prizes); return renderList(); }
    if (a === 'disconnect') { const r = await ask({ title: 'Disconnect this device?', body: 'You will need the staff link or code again to connect.', ok: 'Disconnect', danger: true }); return r.ok && disconnect(); }
    if (a === 'csv') return download();
    if (a === 'copy') { try { await navigator.clipboard.writeText(extra || ''); flash('Message copied'); } catch (e) { flash('Copy is not available on this device', true); } return; }
    if (a === 'give' || a === 'void' || a === 'undo') {
      const r = (S.rows.find(x => x.code === code) || S.found);
      if (a === 'give') {
        if (r && r.risk === 'REVIEW') { const w = await ask({ title: '⚠️ Check this score first', body: 'This run was flagged for review (' + why(r) + '). Check it with the owner before handing over a prize. Give the prize anyway?', ok: 'Give anyway', danger: true }); if (!w.ok) return; }
        const ok = await ask({ title: 'Give the prize?', body: 'Hand over the prize to <b>' + esc(r ? r.name : 'this player') + '</b> (code ' + esc(code) + '). It can only be given once.', ok: '🎁 Give prize' }); if (!ok.ok) return;
        if (!S.who) { const w2 = await ask({ title: 'Your name', body: 'It is saved with the prize record so everyone knows who handed it over.', input: { label: 'Your name', value: '', placeholder: 'e.g. Ana' }, ok: 'Save' }); S.who = (w2.value || 'staff').trim().slice(0, 12) || 'staff'; LS.set('wg_staff_who', S.who); }
      }
      if (a === 'void') { const v = await ask({ title: 'Remove this score?', body: 'It disappears from the leaderboard. You can restore it later in the Sheet.', ok: 'Remove score', danger: true }); if (!v.ok) return; }
      const j = await call({ action: 'a_mark', code, status: a === 'give' ? 'CLAIMED' : a === 'void' ? 'VOID' : 'OK', by: S.who || 'staff' });
      patchRow(j.row); if (a === 'void') { S.rows = S.rows.filter(x => x.code !== code); S.found = null; }
      renderList(); flash(a === 'give' ? '🎁 Prize recorded for ' + j.row.name : a === 'void' ? 'Score removed' : 'Restored'); return;
    }
    if (a === 'compsave') return saveComp();
    if (a === 'compclear') { const r = await ask({ title: 'Remove the competition?', body: 'Its scores stay in the Sheet. Rank goes back to the normal board.', ok: 'Remove', danger: true }); if (!r.ok) return; const j = await call({ action: 'a_comp_clear' }); S.comp = j.comp; if (S.mode === 'contest') S.mode = 'rank'; flash('Competition removed'); return load(); }
    if (a === 'season') {
      const n = await ask({ title: 'Start a new board now?', body: 'This starts a <b>fresh, empty board</b> for every mode right now (Rank keeps its competition board while a competition runs). Old scores stay safe in the Sheet. Give the new board a name:', input: { label: 'Board name', value: '', placeholder: 'e.g. Grand Finals' }, ok: 'Start new board' });
      if (!n.ok || !String(n.value).trim()) return;
      const j = await call({ action: 'a_season', season: n.value }); flash('New board started: ' + j.season); return load();
    }
    if (a === 'autoseason') { const r = await ask({ title: 'Go back to automatic boards?', body: 'Boards will follow the normal weekly schedule again (Monday 12:00 AM, Philippine time).', ok: 'Use automatic' }); if (!r.ok) return; const j = await call({ action: 'a_season', season: '' }); flash('Automatic boards are on'); return load(); }
    if (a === 'diag') { const j = await call({ action: 'a_diag' }); S.diag = j; renderTools(); return; }
    if (a === 'diagclose') { S.diag = null; return renderTools(); }
    if (a === 'adopt') { const r = await ask({ title: 'Show this week\u2019s earlier scores?', body: 'Some scores from <b>this week</b> are filed under the old weekly name, so they are missing from today\u2019s board. This puts them on the current board. Older weeks are not touched, and nothing is deleted.', ok: 'Show them' }); if (!r.ok) return; const j = await call({ action: 'a_adopt' }); flash(j.moved + ' scores are now on the current board'); return act('diag'); }
    if (a === 'repair') { const j = await call({ action: 'a_repair' }); flash('Repaired ' + j.fixed + ' cells'); return act('diag'); }
    if (a === 'testconn') { S.busy = false; await load(); if (!S.error) flash('Connected ✓'); return; }
  } catch (e) { flash(e.message, true); }
}
let lookupT = 0;
function onSearch(v) {
  S.q = v; S.found = null; renderList();
  clearTimeout(lookupT);
  const c = norm(v);
  if (/^(RB-?)?[0-9A-F]{4}-?[0-9A-F]{4}$/.test(c) && !visible().length) {                      // a full code that isn't in the list: ask the server
    const full = c.replace(/^RB-?/, '').replace('-', ''), code = 'RB-' + full.slice(0, 4) + '-' + full.slice(4, 8);
    lookupT = setTimeout(async () => { try { const j = await call({ action: 'a_lookup', code }); S.found = j.row; S.error = ''; } catch (e) { S.error = e.message; } renderList(); renderBanner(); }, 250);
  }
}
function download() {
  const head = ['Rank', 'Name', 'Mobile', 'Score', 'Code', 'Check', 'Status', 'When'];
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const csv = [head.join(',')].concat(S.rows.map((r, i) => [i + 1, r.name, r.contact, r.score, r.code, r.risk, r.status, r.when].map(q).join(','))).join('\n');
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'winners-' + S.mode + '-' + S.season + '.csv'; a.click(); } catch (e) { flash('Download is not available here', true); }
  return csv;
}

/* ---------- competition ---------- */
const nextHour = () => Math.ceil(Date.now() / 3600e3) * 3600e3;
function localInput(ms) { const d = new Date(ms), p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); }
const when = ms => { try { return new Date(ms).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); } catch (e) { return ''; } };
const left = ms => { ms = Math.max(0, ms); const q = Math.floor(ms / 1000), d = Math.floor(q / 86400), h = Math.floor(q % 86400 / 3600), m = Math.floor(q % 3600 / 60); return d ? d + 'd ' + h + 'h' : h ? h + 'h ' + m + 'm' : m + 'm'; };
function compStatus(c) { return !c ? 'No competition is set.' : { upcoming: 'Starts ' + when(c.start) + '.', live: 'LIVE until ' + when(c.end) + '.', closing: 'Ended. Late uploads are accepted until ' + when(c.end + c.grace * 60000) + '.', ended: 'Ended ' + when(c.end) + '. The winners are shown to everyone in the game.' }[c.state]; }
async function saveComp() {
  const msg = $('compmsg'), name = $('cn').value.trim(), start = new Date($('cs').value).getTime(), n = +$('cd').value, unit = $('cu').value, grace = +$('cg').value;
  const bad = t => { msg.innerHTML = '<span style="color:var(--bad)">' + esc(t) + '</span>'; };
  if (!name) return bad('Give the competition a name.');
  if (!(start > 0)) return bad('Pick the start date and time.');
  if (!(n >= 1)) return bad('Say how long it lasts (at least 1).');
  const end = start + n * (unit === 'hours' ? 3600e3 : 86400e3);
  msg.textContent = 'Saving…';
  try { const j = await call({ action: 'a_comp_set', name, start, end, grace: isNaN(grace) ? 15 : grace }); S.comp = j.comp; S.form = null; msg.textContent = ''; flash('Competition saved: ' + name); return load(); }

const REFUSED = { version: 'the game and the server are on different versions (update both: Code.gs and every file of the game)', contact: 'Rank needs a Philippine mobile number and the player did not give a valid one', closed: 'the competition had already ended', mismatch: 'the score did not match the server\u2019s replay (an out-of-date game, or tampering)', token: 'the session was not valid', expired: 'the session was older than 7 days', device: 'the session belonged to another phone', rate: 'too many tries from one phone', server: 'the server could not save the row (see the problems below)', size: 'the upload was too large', time: 'the run failed the time check', clock: 'the run failed the time check', timing: 'the run failed the replay check', kind: 'the run failed the replay check', order: 'the run failed the replay check', item: 'the run failed the replay check', format: 'the run failed the replay check', afterover: 'the run failed the replay check', events: 'the run was too long to check', name: 'no name was given', used: 'the same session was sent twice', busy: 'the server was busy', mode: 'unknown mode', unknown: 'unknown reason' };

function diagCard() {
