/* =====================================================================================
   DETAILED 2D ART: a small toolkit for shaded, realistic-looking drawings, then the eight mythical bosses.
   Everything is drawn from shapes (no pictures, no emoji): identical on every device and sharp at any size.
   ===================================================================================== */
const DARK = '#140c24';
const RGBA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; };
function lg(g, x0, y0, x1, y1, st) { const r = g.createLinearGradient(x0, y0, x1, y1); st.forEach((c, i) => r.addColorStop(i / (st.length - 1), c)); return r; }
function rg(g, x, y, r0, r1, st) { const r = g.createRadialGradient(x, y, r0, x, y, r1); st.forEach((c, i) => r.addColorStop(i / (st.length - 1), c)); return r; }
function glowDot(g, x, y, r, col, a) { if (typeof cfg !== 'undefined' && cfg.quality === 'low' && r > 50 && a < .45) return;   // (big soft glows are skipped on the Low graphics setting)
  g.fillStyle = rg(g, x, y, 0, r, [RGBA(col, a), RGBA(col, 0)]); g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill(); }
function ink(g, w, col) { g.strokeStyle = col || DARK; g.lineWidth = w || 2.5; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke(); }
function body(g, fill, w) { g.fillStyle = fill; g.fill(); ink(g, w); }
function blob(g, x, y, rx, ry, st, w, rot) {                       // a lit ellipse: light from the top left, soft shadow at the bottom right, thin outline
  g.beginPath(); g.ellipse(x, y, rx, ry, rot || 0, 0, 6.283); g.fillStyle = rg(g, x - rx * .35, y - ry * .4, rx * .08, Math.max(rx, ry) * 1.15, st); g.fill(); ink(g, w == null ? 2.2 : w);
}
function scalesIn(g, cx, cy, rx, ry, sz, col, a) {                 // rows of small scales drawn inside an ellipse
  g.strokeStyle = RGBA(col, a == null ? .5 : a); g.lineWidth = 1.2; g.lineCap = 'round';
  for (let j = -ry; j <= ry; j += sz * .75) for (let i = -rx; i <= rx; i += sz) { const x = cx + i + (Math.round(j / (sz * .75)) % 2 ? sz / 2 : 0), y = cy + j; const q = ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2; if (q < .86) { g.beginPath(); g.arc(x, y, sz * .5, .15, 3); g.stroke(); } }
}
function spikeP(g, x, y, ang, len, w, c1, c2, lw) {                // a spike / horn / claw: a curved, tapering, lit shape
  const ux = Math.cos(ang), uy = Math.sin(ang), px = -uy, py = ux;
  g.beginPath(); g.moveTo(x + px * w, y + py * w); g.quadraticCurveTo(x + ux * len * .55 + px * w * .55, y + uy * len * .55 + py * w * .55, x + ux * len, y + uy * len); g.quadraticCurveTo(x + ux * len * .5 - px * w * .35, y + uy * len * .5 - py * w * .35, x - px * w, y - py * w); g.closePath();
  g.fillStyle = lg(g, x, y, x + ux * len, y + uy * len, [c1, c2]); g.fill(); ink(g, lw == null ? 2 : lw);
}
function featherP(g, x, y, ang, len, w, c1, c2) {                  // one feather with a quill line

/* ============ network (never blocks the game loop) ============ */
async function api(method, params, body, ms) {
  if (!HAS_NET) throw new Error('no fetch');

  try {

    const sig = ctl ? { signal: ctl.signal } : {}, base = { redirect: 'follow', mode: 'cors', credentials: 'omit', cache: 'no-store' };
    const r = await fetch(url, method === 'GET' ? Object.assign(base, sig) : Object.assign(base, { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' } }, sig));
    let j; try { j = await r.json(); } catch (e) { noteNet(false, 'html'); throw e; }   // a web page instead of data: the server is not public
    noteNet(true); return j;
  } catch (e) {
    if (e && e.name === 'AbortError') netSlowAt = Date.now();                    // too slow: not the same as offline
    else if (!(netDown && netWhy === 'html')) noteNet(false, 'blocked');

  } finally { clearTimeout(to); }
}
async function retry(fn, tries) {

    if (i < tries - 1) await sleep(Math.min(6000, 600 * Math.pow(2, i)) + Math.random() * 400);   // exponential back-off with jitter spreads out crowds
  }
  return lastR;
}
async function fetchPage(m, off) {

  try {

    if (r && r.ok) { noteRules(r.rules); noteServer(r); noteSeason(m, r.season); if (off === 0) LS.set('us_lbc_' + m, { season: r.season, info: r.info, players: r.players, updated: r.updated, rows: r.rows, got: Date.now() }); return r; }
  } catch (e) {}
  return null;
}
let flushing = false;
const pendingList = () => LS.get('us_pending', []);
function enqueue(p) { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}   // a score is waiting on this device: ask the browser not to clear it

// Safe to repeat (the server returns the same code for the same run). "Full jitter" back-off spreads a crowd out instead of hammering a busy server.
async function trySubmit(p, budgetMs, onBusy) {
